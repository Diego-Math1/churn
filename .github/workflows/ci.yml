name: CI - Qualidade de Código e Dados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churn
          POSTGRES_USER: churn
          POSTGRES_PASSWORD: churn
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "psycopg[binary]"

      - name: Rodar Linter (Ruff)
        run: ruff check .

      - name: Configurar dbt profile
        run: |
          mkdir -p ~/.dbt
          echo "churn:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5432
                user: churn
                password: churn
                dbname: churn
                schema: public
                threads: 4" > ~/.dbt/profiles.yml

      - name: Rodar testes do dbt
        run: |
          cd dbt_project
          dbt build
